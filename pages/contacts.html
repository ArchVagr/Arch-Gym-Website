<!DOCTYPE html>
<html>
<head> 
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oganes Gym</title>
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/contacts.css">
</head>
<body>
    <header>
        <h1><span class="title_text">ARCH</span>GYM</h1>
        <a href="../pages/home.html" class="navigation_menu">Home</a>
        <a href="../pages/about.html" class="navigation_menu">About</a>
        <a href="../pages/contacts.html" class="navigation_menu">Contact us</a>
    </header>
 
    <div class="contacts">
    <div class="contacts_cardholder">
            <div class="contacts_card">
                <p class="contact_card_title">+41 3451356</p>
                <p class="contact_card_description">PHONE NUMBER</p>
            </div>
            <div class="contacts_card">
                <p class="contact_card_title">arch-gym@gmail.com</p>
                <p class="contact_card_description">EMAIL</p>
            </div>
            <div class="contacts_card">
                <p class="contact_card_title">OGANES KHIDIRYAN</p>
                <p class="contact_card_description">FOUNDER</p>
                </div>
            <div class="contacts_card">
                <p class="contact_card_title">Bla-Bla Av. 54, 81641</p>
                <p class="contact_card_description">Address</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer_title">
            <h3 class="footer_title_main">Start your journey <span class="footer_sub">now</span></h3>
            <p class="footer_description">Get in contact with us</p>
        </div>
        <form action="submit" method="post" class="footer_form">

            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="mail@example.com">

            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" placeholder="+44...">

            <label for="message">Message</label>
            <textarea id="message" class="footer_text" name="message" rows="4" placeholder="Your request..."></textarea>

            <div class="plan-picker">
                <label class="plan-opt">
                  <input type="radio" name="plan" value="basic" checked>
                  <span class="p-name">Basic</span>
                  <span class="p-price">50$/month</span>
                </label>

                <label class="plan-opt">
                  <input type="radio" name="plan" value="pro">
                  <span class="p-name">Pro</span>
                  <span class="p-price">100$/month</span>
                </label>

                <label class="plan-opt">
                  <input type="radio" name="plan" value="ultra">
                  <span class="p-name">Ultra</span>
                  <span class="p-price">150$/month</span>
                </label>
            </div>

            <button type="submit" class="footer_button">Send</button>
        </form>
    </footer>
</body>
